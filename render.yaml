services:
  - type: web
    name: incampus-nitp-api
    runtime: python
    rootDir: backend
    buildCommand: bash render-build.sh
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://incampus-nitp.vercel.app
